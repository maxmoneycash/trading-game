<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trading-game</title>
<meta name="description" content="Setup Rush, a trading game for calculators and handhelds, running in your browser: the T-Deck build, compiled to WebAssembly.">
<style>
  :root { --bg: #0b0c0e; --card: #15171b; --line: #262a31; --text: #e8e6e1; --muted: #8b8f98; --orange: #ff5c1a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .02em; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .deck { width: min(960px, 100%); }
  .screen { position: relative; aspect-ratio: 4 / 3; background: #000; border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; outline: none; touch-action: none; }
  .start { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.55);
    border: 0; color: var(--text); cursor: pointer; font: inherit; }
  .start span { background: var(--orange); color: #000; font-weight: 700; padding: 10px 22px;
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
  .start[hidden] { display: none; }
  .keys { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; color: var(--muted); }
  .keys b { color: var(--text); font-weight: 600; border: 1px solid var(--line); background: var(--card);
    border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
  .touch { display: none; }
  @media (hover: none) and (pointer: coarse) { .touch { display: flex; } .keyboard { display: none; } }
  .screen, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .bar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .bar a { color: var(--muted); text-decoration: none; }
  .bar a:hover { color: var(--text); }
  .name { font-weight: 700; }
</style>
</head>
<body>
<main>
  <div class="deck">
    <div class="bar"><span class="name">trading-game</span><a href="https://github.com/maxmoneycash/trading-game">GitHub</a></div>
    <div class="screen">
      <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
      <button class="start" id="start" hidden><span>PLAY</span></button>
    </div>
    <div class="keys keyboard">
      <span><b>W</b>hold to ride long</span>
      <span><b>S</b>hold to ride short</span>
      <span><b>let go</b>cash out</span>
      <span><b>arrows</b>menu</span>
      <span><b>enter</b>select</span>
      <span><b>esc</b>back</span>
      <span><b>mouse</b>touchscreen</span>
    </div>
    <div class="keys touch">
      <span><b>hold</b>ride long</span>
      <span><b>slide down</b>go short</span>
      <span><b>let go</b>cash out</span>
      <span><b>tap</b>menus</span>
    </div>
  </div>
</main>
<script>
  // Browsers keep sound off until a click: the first click starts the game with sound.
  var canvas = document.getElementById('canvas'), start = document.getElementById('start');
  var Module = { canvas: canvas, noInitialRun: true,
    onRuntimeInitialized: function () { start.hidden = false; } };
  start.addEventListener('click', function () { start.hidden = true; canvas.focus(); Module.callMain([]); });
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Backspace'].indexOf(e.key) >= 0) e.preventDefault();
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
