; Setup Rush for the LilyGo T-Deck / T-Deck Plus: the whole firmware is the game.
; Build: platformio run   Flash: tools/flash.sh   (game/main.c is turned into src/platform/srush_game.c on every build)
[platformio]
default_envs = setup-rush
boards_dir = boards

[env:setup-rush]
platform = espressif32@6.13.0
board = T-Deck
framework = arduino
build_type = release
extra_scripts =
    pre:scripts/sync_game.py
    post:scripts/esp32_factory.py
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = default_16MB.csv
; the charts and fonts (tools/make_pack.py), linked into flash
board_build.embed_files = data/srpack.bin
build_src_filter = +<app/> +<platform/> +<device/>
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    ; keep the builder's home directory out of the image (asserts and logs embed __FILE__)
    -ffile-prefix-map=$PROJECT_PACKAGES_DIR=pio-packages
    -ffile-prefix-map=$PROJECT_DIR=.
    -DTDECK_DEVICE=1
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_MISO=38
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=12
    -DTFT_DC=11
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
lib_deps =
    https://github.com/maxmoneycash/TFT_eSPI.git#880ec0e4657c0de56d28cc250bdbbe863386021e
    mikalhart/TinyGPSPlus@1.1.0
